# Alternativa a instalar PostgreSQL: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: academico
      POSTGRES_PASSWORD: academico123
      POSTGRES_DB: academico
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
