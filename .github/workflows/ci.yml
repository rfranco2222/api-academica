name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: academico
          POSTGRES_PASSWORD: academico123
          POSTGRES_DB: academico_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crear .env.test
        run: |
          cat > .env.test <<'ENV'
          NODE_ENV=test
          LOG_LEVEL=silent
          DATABASE_URL=postgres://academico:academico123@localhost:5432/academico_test
          JWT_ACCESS_SECRET=secreto-de-ci-con-mas-de-treinta-y-dos-caracteres
          CORS_ORIGINS=http://localhost:5173
          ENV
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
